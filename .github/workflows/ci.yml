name: check

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --directory services/api
      - run: uv run --directory services/api ruff check .
      - run: uv run --directory services/api mypy app optimiser fusion analytics scenarios
      - run: uv run --directory services/api pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vyuha/web lint
      - run: pnpm --filter @vyuha/web typecheck
      - run: pnpm --filter @vyuha/web test
      - run: pnpm build
      - run: node scripts/check-offline.mjs
      - run: pnpm exec playwright install chromium
      - run: pnpm --filter @vyuha/web e2e
