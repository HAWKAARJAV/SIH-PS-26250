services:
  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/vyuha.db
      DEMO_MODE: "true"
      JWT_SECRET: replace-with-32-bytes-minimum-secret
      COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    volumes:
      - api-data:/data
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    environment:
      API_ORIGIN: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  api-data:
